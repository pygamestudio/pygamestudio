name: android-runtime-spike

# Spike 1 + 2 of the Android runtime plan:
#   1. cross-compile python3 + pygame-ce + cffi + pymunk for arm64-v8a (p4a)
#   2. publish the produced `dist/` + a report of its private.tar layout, so the
#      Windows side can verify that the payload can be rebuilt locally.
#
# This runner installs the Android SDK/NDK - it is the *one* place allowed to do
# that. The editor on a user machine never downloads a toolchain.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/android_spike/**'
      - '.github/workflows/android-runtime-spike.yml'

concurrency:
  group: android-runtime-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      # The SDK/NDK download is the slow part (~20 min); keep it between runs.
      # Delete this step if the repository cache quota becomes a problem.
      # NOTE: buildozer keeps the SDK in $HOME/.buildozer/android/platform, not
      # in the project's .buildozer, so both paths have to be cached.
      - name: Cache buildozer (SDK, NDK, p4a builds)
        uses: actions/cache@v4
        with:
          path: |
            tools/android_spike/.buildozer
            /github/home/.buildozer/android/platform
          key: pygs-android-spike-v2-${{ hashFiles('tools/android_spike/buildozer.spec') }}-${{ hashFiles('tools/android_spike/p4a_recipes/**') }}
          restore-keys: |
            pygs-android-spike-

      # buildozer downloads a 2020 vintage command line tools whose sdkmanager
      # cannot install API 34, and then fails with "Requested API target 34 is
      # not available". Install the platform ourselves with a current
      # sdkmanager; buildozer then finds an SDK that already has it.
      # buildozer also insists on the legacy <sdk>/tools/bin/sdkmanager path,
      # so link the modern binary there.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK=$SDK"

          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            mkdir -p "$SDK/cmdline-tools"
            python3 - <<'PY'
          import urllib.request
          url = ('https://dl.google.com/android/repository/'
                 'commandlinetools-linux-11076708_latest.zip')
          urllib.request.urlretrieve(url, '/tmp/cmdline-tools.zip')
          PY
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            if [ ! -d "$SDK/cmdline-tools/latest" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi

            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

          # buildozer only knows the pre-2021 layout.
          mkdir -p "$SDK/tools/bin"
          ln -sf ../../cmdline-tools/latest/bin/sdkmanager "$SDK/tools/bin/sdkmanager"
          ln -sf ../../cmdline-tools/latest/bin/avdmanager "$SDK/tools/bin/avdmanager"

          ls "$SDK/platforms" "$SDK/build-tools"
          ls -l "$SDK/tools/bin"

      - name: Build the spike APK
        working-directory: tools/android_spike
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      # Inject the app's own icon and splash into the dist, then repackage: this
      # is the asset step the editor will run before Gradle. p4a re-renders
      # res/values/strings.xml from templates/strings.tmpl.xml on every packaging
      # run, so android_assets.py pins the splash colour in both places.
      # The script uses PySide6 on a developer machine and falls back to Pillow;
      # this container has neither Qt nor a display, so install Pillow.
      - name: Install the asset tool dependencies
        run: python3 -m pip install --quiet pillow

      - name: Apply icon and splash
        working-directory: tools/android_spike
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)
          python3 android_assets.py "${DIST%/}" \
            --icon assets/icon.png \
            --presplash assets/presplash.jpg

      - name: Repackage the APK with the new assets
        working-directory: tools/android_spike
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee -a buildozer.log

      # Never let a failed inspection cost us the APK again: this step may fail,
      # the artefacts are uploaded unconditionally right after it, and only then
      # does the payload gate decide whether the job is red. if: always() is what
      # keeps it running when an earlier step (the asset injection) failed.
      - name: Inspect the produced dist
        if: always()
        continue-on-error: true
        working-directory: tools/android_spike
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)
          DIST="${DIST%/}"
          echo "DIST=$DIST" >> "$GITHUB_ENV"
          python3 inspect_dist.py inspect "$DIST" | tee inspect.log
          python3 inspect_dist.py bundle "$DIST" --out libpybundle_rebuilt.so | tee -a inspect.log

      - name: Pack the dist
        if: always()
        working-directory: tools/android_spike
        run: |
          DIST="${DIST:-$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)}"
          DIST="${DIST%/}"
          echo "packing $DIST"
          tar -czf pygs-dist.tgz -C "$(dirname "${DIST}")" "$(basename "${DIST}")"

      - name: Upload spike artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pygs-android-spike
          if-no-files-found: warn
          retention-days: 14
          path: |
            tools/android_spike/bin/*.apk
            tools/android_spike/buildozer.log
            tools/android_spike/inspect.log
            tools/android_spike/pygs-dist.tgz

      # Spike 1 + 2 acceptance: the payload must carry the four packages the
      # engine needs, every pygame extension module must be compiled in, and the
      # bundle must be rebuildable here with the stdlib only.
      - name: Check the payload
        if: always()
        working-directory: tools/android_spike
        run: |
          if [ ! -s inspect.log ]; then
            echo "::error::inspect.log is missing - an earlier step failed, see its log above"
            exit 1
          fi
          grep -qE 'required modules missing  : none' inspect.log || {
            echo "::error::pygame is missing extension modules - see inspect.log"; exit 1; }
          for package in pygame pymunk cffi _cffi_backend; do
            grep -qE "^     ${package} +[0-9]+ files.* ok$" inspect.log || {
              echo "::error::${package} is missing from site-packages"; exit 1; }
          done
          grep -qE '^RESULT : bundle rebuilt in the layout the Android side expects' inspect.log || {
            echo "::error::libpybundle.so could not be rebuilt - see inspect.log"; exit 1; }
          echo "payload ok"

      - name: Show diagnostics on failure
        if: failure()
        working-directory: tools/android_spike
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo '--- SDK platforms'; ls "$SDK/platforms" 2>/dev/null || echo '(none)'
          echo '--- SDK cmdline-tools'; ls "$SDK/cmdline-tools" 2>/dev/null || echo '(none)'
          echo '--- SDK build-tools'; ls "$SDK/build-tools" 2>/dev/null || echo '(none)'
          echo '--- errors in the log'
          grep -n -i -E 'error|exception|traceback|not available' buildozer.log | tail -n 40 || true
          echo '--- log tail'
          tail -n 120 buildozer.log || true
