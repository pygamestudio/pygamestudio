name: android-runtime-spike

# This job does NOT build anybody's game - games are packaged inside the editor,
# on the user's machine, with the Android SDK tools (see gui/build/android_apk.py)
# and without Gradle, AGP or a network connection.
#
# Its ONE purpose is to (re)build the frozen runtime pack that ships in
# src/pygamestudio/common/res/android: python + pygame-ce + pymunk + SDL2
# cross-compiled for Android by python-for-android. That is the only step that
# needs a Linux container, an NDK and ~1 hour. Run it by hand - and only when a
# version inside the pack changes (pygame-ce / pymunk / cffi / p4a / python /
# the Android platform); the "when to re-freeze" table in
# tools/android_spike/README.md lists the cases.
on:
  workflow_dispatch:

concurrency:
  group: android-runtime-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      # The NDK download is the slow part (~20 min); keep it, but keep it
      # SEPARATE from the p4a build tree below.
      - name: Cache the Android NDK
        uses: actions/cache@v4
        with:
          path: /github/home/.buildozer/android/platform/android-ndk-r25b
          key: pygs-android-ndk-25b

      # The p4a build tree is keyed by the recipes and has NO restore-keys on
      # purpose: p4a skips a recipe that is already in the dist (dist_info.json)
      # whatever its build directory says, so restoring an old tree would make a
      # recipe edit silently do nothing - which is exactly how the first two
      # _freetype attempts shipped without the module. A recipe change misses the
      # cache and rebuilds the tree; the NDK and the SDK stay cached.
      - name: Cache the p4a build tree
        uses: actions/cache@v4
        with:
          path: |
            tools/android_spike/.buildozer
            /github/home/.buildozer/android/platform/build-arm64-v8a
            /github/home/.buildozer/android/platform/python-for-android
          key: pygs-build-${{ hashFiles('tools/android_spike/buildozer.spec') }}-${{ hashFiles('tools/android_spike/p4a_recipes/**', 'tools/android_spike/app/**') }}

      # buildozer downloads a 2020 vintage command line tools whose sdkmanager
      # cannot install API 34, and then fails with "Requested API target 34 is
      # not available". Install the platform ourselves with a current
      # sdkmanager; buildozer then finds an SDK that already has it.
      # buildozer also insists on the legacy <sdk>/tools/bin/sdkmanager path,
      # so link the modern binary there.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK=$SDK"

          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            mkdir -p "$SDK/cmdline-tools"
            python3 - <<'PY'
          import urllib.request
          url = ('https://dl.google.com/android/repository/'
                 'commandlinetools-linux-11076708_latest.zip')
          urllib.request.urlretrieve(url, '/tmp/cmdline-tools.zip')
          PY
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            if [ ! -d "$SDK/cmdline-tools/latest" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi

            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

          # buildozer only knows the pre-2021 layout.
          mkdir -p "$SDK/tools/bin"
          ln -sf ../../cmdline-tools/latest/bin/sdkmanager "$SDK/tools/bin/sdkmanager"
          ln -sf ../../cmdline-tools/latest/bin/avdmanager "$SDK/tools/bin/avdmanager"

          ls "$SDK/platforms" "$SDK/build-tools"
          ls -l "$SDK/tools/bin"

      - name: Stage the engine into the spike app
        run: |
          python3 tools/android_spike/engine_runtime.py \
            src/pygamestudio tools/android_spike/app
          find tools/android_spike/app/pygamestudio -name '*.py' | wc -l

      # A project that imports numpy (or pygame.freetype, which p4a does not
      # build) packages fine and then dies on the phone with a black screen.
      # Refuse that here, with the module name.
      - name: Scan the project imports
        working-directory: tools/android_spike
        run: python3 project_scan.py app | tee scan.log

      - name: Build the spike APK
        working-directory: tools/android_spike
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      # pygame._freetype links against libfreetype.so, so that library has to be
      # in the dist's libs dir (p4a copies recipe libraries there). If a build
      # ever links it from the recipe's build tree only, the .so would be missing
      # from the APK and the import would fail on the device - so check and fix
      # it here, and say so in the log.
      - name: Make sure libfreetype ships with the app
        if: always()
        working-directory: tools/android_spike
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/*/ 2>/dev/null | head -n 1)
          DIST="${DIST%/}"
          [ -n "$DIST" ] || { echo "no dist yet, nothing to fix"; exit 0; }
          LIBS="$DIST/libs/arm64-v8a"
          mkdir -p "$LIBS"
          if ls "$LIBS"/libfreetype*.so >/dev/null 2>&1; then
            echo "libfreetype already in $LIBS"
            exit 0
          fi
          SRC=$(ls .buildozer/android/platform/build-*/build/other_builds/freetype/*/freetype/objs/.libs/libfreetype.so \
                  "$HOME"/.buildozer/android/platform/build-*/build/other_builds/freetype/*/freetype/objs/.libs/libfreetype.so \
                  2>/dev/null | head -n 1)
          if [ -n "$SRC" ]; then
            cp "$SRC" "$LIBS/"
            echo "copied $SRC into $LIBS"
          else
            echo "::warning::libfreetype.so not found - pygame._freetype would fail to load on the device"
          fi

      # Inject the app's own icon and splash into the dist, then repackage: this
      # is the asset step the editor will run before Gradle. p4a re-renders
      # res/values/strings.xml from templates/strings.tmpl.xml on every packaging
      # run, so android_assets.py pins the splash colour in both places.
      # The script uses PySide6 on a developer machine and falls back to Pillow;
      # this container has neither Qt nor a display, so install Pillow.
      - name: Install the asset tool dependencies
        run: python3 -m pip install --quiet pillow

      - name: Apply icon and splash
        working-directory: tools/android_spike
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)
          python3 android_assets.py "${DIST%/}" \
            --icon assets/icon.png \
            --presplash assets/presplash.jpg

      - name: Repackage the APK with the new assets
        working-directory: tools/android_spike
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee -a buildozer.log

      # Never let a failed inspection cost us the APK again: this step may fail,
      # the artefacts are uploaded unconditionally right after it, and only then
      # does the payload gate decide whether the job is red. if: always() is what
      # keeps it running when an earlier step (the asset injection) failed.
      - name: Inspect the produced dist
        if: always()
        continue-on-error: true
        working-directory: tools/android_spike
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)
          DIST="${DIST%/}"
          echo "DIST=$DIST" >> "$GITHUB_ENV"
          python3 inspect_dist.py inspect "$DIST" | tee inspect.log
          python3 inspect_dist.py bundle "$DIST" --out libpybundle_rebuilt.so | tee -a inspect.log
          # pygame._freetype is an optional module: the recipe hands pygame's
          # detection a pkg-config file and include/lib flags, but a failure to
          # find freetype only means the module is skipped (as it was before).
          if ls "$DIST"/_python_bundle__*/_python_bundle/site-packages/pygame/_freetype*.so >/dev/null 2>&1; then
            echo "_freetype   : built" | tee -a inspect.log
          else
            echo "::warning::pygame._freetype was not built - freetype detection failed, the module is missing"
            echo "_freetype   : missing" | tee -a inspect.log
          fi
          # Why did it not build? The recipe logs every decision, so keep those
          # lines in the uploaded report instead of burying them in the log.
          echo '--- freetype decisions (from the build log)' | tee -a inspect.log
          grep -i 'freetype' buildozer.log | tail -n 25 | tee -a inspect.log || true

      - name: Pack the dist
        if: always()
        working-directory: tools/android_spike
        run: |
          DIST="${DIST:-$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)}"
          DIST="${DIST%/}"
          echo "packing $DIST"
          tar -czf pygs-dist.tgz -C "$(dirname "${DIST}")" "$(basename "${DIST}")"

      # The artefact the editor ships: everything an APK needs except the game.
      # LZMA by default - ~12% smaller than deflate and the editor only pays for
      # it once, when it unpacks the pack into its cache.
      - name: Freeze the runtime artefact
        if: always()
        working-directory: tools/android_spike
        run: |
          DIST="${DIST:-$(ls -d .buildozer/android/platform/build-*/dists/*/ | head -n 1)}"
          DIST="${DIST%/}"
          [ -d "$DIST" ] || { echo "::warning::no dist to freeze"; exit 0; }
          python3 freeze_runtime.py "$DIST" --out bin --version 1.0.0 \
            | tee -a inspect.log

      - name: Upload spike artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pygs-android-spike
          if-no-files-found: warn
          retention-days: 14
          path: |
            tools/android_spike/bin/*.apk
            tools/android_spike/bin/pygs-android-runtime-*.zip
            tools/android_spike/bin/VERSION.json
            tools/android_spike/buildozer.log
            tools/android_spike/inspect.log
            tools/android_spike/scan.log
            tools/android_spike/pygs-dist.tgz

      # Spike 1 + 2 acceptance: the payload must carry the four packages the
      # engine needs, every pygame extension module must be compiled in, and the
      # bundle must be rebuildable here with the stdlib only.
      - name: Check the payload
        if: always()
        working-directory: tools/android_spike
        run: |
          if [ ! -s inspect.log ]; then
            echo "::error::inspect.log is missing - an earlier step failed, see its log above"
            exit 1
          fi
          grep -qE 'required modules missing  : none' inspect.log || {
            echo "::error::pygame is missing extension modules - see inspect.log"; exit 1; }
          for package in pygame pymunk cffi _cffi_backend; do
            grep -qE "^     ${package} +[0-9]+ files.* ok$" inspect.log || {
              echo "::error::${package} is missing from site-packages"; exit 1; }
          done
          grep -qE '^RESULT : bundle rebuilt in the layout the Android side expects' inspect.log || {
            echo "::error::libpybundle.so could not be rebuilt - see inspect.log"; exit 1; }
          # Spike 3b: the app payload has to carry the entrypoint as .py (p4a
          # byte-compiles it away otherwise), the spike project and the engine.
          grep -qE '^RESULT : app payload complete' inspect.log || {
            echo "::error::the APK payload is missing the engine or the project - see inspect.log"; exit 1; }
          grep -qE '^   engine files +: [0-9]{2,}' inspect.log || {
            echo "::error::the engine was not staged into the app payload - see inspect.log"; exit 1; }
          echo "payload ok"

      - name: Show diagnostics on failure
        if: failure()
        working-directory: tools/android_spike
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo '--- SDK platforms'; ls "$SDK/platforms" 2>/dev/null || echo '(none)'
          echo '--- SDK cmdline-tools'; ls "$SDK/cmdline-tools" 2>/dev/null || echo '(none)'
          echo '--- SDK build-tools'; ls "$SDK/build-tools" 2>/dev/null || echo '(none)'
          echo '--- errors in the log'
          grep -n -i -E 'error|exception|traceback|not available' buildozer.log | tail -n 40 || true
          echo '--- log tail'
          tail -n 120 buildozer.log || true
