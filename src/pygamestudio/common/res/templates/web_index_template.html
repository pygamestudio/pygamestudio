<!DOCTYPE html>
<!-- Generated by PyGameStudio (Web build).

     The page runs the game entirely inside the browser: Pyodide starts Python,
     game.zip is unpacked into its file system and web_boot.py starts the game
     loop. Nothing is uploaded anywhere, and there is nothing to click: the
     game starts by itself once it is ready (the thin bar under the canvas
     shows the loading progress).

     Serve this folder over HTTP (python -m http.server is enough): opening the
     file directly (file://) blocks the download of game.zip.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PYGS_TITLE__</title>
__PYGS_FAVICON_LINK__
<style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #17181c; color: #e6e6ea;
                 font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
    #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .3px; }
    canvas#canvas { background: #000; max-width: 100%; height: auto; border-radius: 6px;
                    box-shadow: 0 10px 40px rgba(0, 0, 0, .55); outline: none; }
    #loader { display: flex; flex-direction: column; align-items: center; gap: 8px;
              width: min(320px, 80vw); }
    #loader-track { width: 100%; height: 4px; border-radius: 2px; background: #2a2c33; overflow: hidden; }
    #loader-bar { width: 4%; height: 100%; border-radius: 2px; background: #4f8cff;
                  transition: width .25s ease; }
    #loader-text { font-size: 12.5px; color: #a9adb8; text-align: center; }
    #error { display: none; max-width: 760px; font-size: 12.5px; line-height: 1.5; color: #ff8080;
             white-space: pre-wrap; word-break: break-word; text-align: left; }
</style>
</head>
<body>
<div id="app">
    <h1>__PYGS_TITLE__</h1>
    <canvas id="canvas" width="__PYGS_CANVAS_WIDTH__" height="__PYGS_CANVAS_HEIGHT__" tabindex="0"></canvas>
    <div id="loader">
        <div id="loader-track"><div id="loader-bar"></div></div>
        <div id="loader-text">0%</div>
    </div>
    <pre id="error"></pre>
</div>

<script type="module">
import { loadPyodide } from "__PYGS_PYODIDE_URL__pyodide.mjs";

// The Pyodide distribution to run (a folder URL that contains pyodide.mjs).
const PYODIDE_URL = "__PYGS_PYODIDE_URL__";

const loaderElement = document.getElementById("loader");
const loaderBar = document.getElementById("loader-bar");
const loaderText = document.getElementById("loader-text");
const errorElement = document.getElementById("error");

// The bar and its caption both show the same progress (no wording).
const setProgress = (percent) => {
    loaderBar.style.width = percent + "%";
    loaderText.textContent = percent + "%";
};

const showError = (error) => {
    console.error(error);
    loaderElement.style.display = "none";
    errorElement.style.display = "block";
    errorElement.textContent = String((error && error.message) ? error.message : error);
};

// Browsers only start audio after a user gesture, so resume the WebAudio
// context of SDL on the first click/tap/key: the game's sound works from then
// on (the game itself is already running).
const resumeAudio = () => {
    try {
        const module = pyodide && pyodide._module;
        const context = module && (module.SDL2 ? module.SDL2.audioContext : null);
        if (context && context.resume) {
            context.resume();
        }
    } catch (error) {
        // No audio context yet: the next gesture tries again.
    }
};
document.addEventListener("pointerdown", resumeAudio);
document.addEventListener("keydown", resumeAudio);

// The bundle entry point: runs web_boot.py (the project root is /game) and
// awaits its async game loop.
const bootSource = `import sys
sys.path.insert(0, "/game")
with open("/game/web_boot.py", "r", encoding="utf-8") as boot_file:
    boot_source = boot_file.read()
namespace = {"__name__": "web_boot", "__file__": "/game/web_boot.py"}
exec(compile(boot_source, "/game/web_boot.py", "exec"), namespace)
await namespace["main"]()
`;

let pyodide = null;

try {
    setProgress(5);
    pyodide = await loadPyodide({ indexURL: PYODIDE_URL });

    // SDL-based packages (pygame) need this opt-in flag and a canvas to draw on.
    pyodide._api._skip_unwind_fatal_error = true;
    setProgress(30);

    await pyodide.loadPackage("pygame-ce");
    setProgress(55);

    const response = await fetch("game.zip");
    if (!response.ok) {
        throw new Error("game.zip could not be loaded. Open this page over HTTP "
            + "(for example: python -m http.server), not from the file system. / "
            + "请通过 HTTP 访问本页面（例如 python -m http.server），不要直接打开文件。");
    }
    const archive = await response.arrayBuffer();
    setProgress(80);

    pyodide.unpackArchive(archive, "zip", { extractDir: "/game" });
    pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
    setProgress(95);

    // No Start button, no extra click: the game starts as soon as it is ready
    // and the loading bar disappears.
    loaderElement.style.display = "none";
    await pyodide.runPythonAsync(bootSource);
} catch (error) {
    showError(error);
}
</script>
</body>
</html>
