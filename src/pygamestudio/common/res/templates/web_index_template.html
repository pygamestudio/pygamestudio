<!DOCTYPE html>
<!-- Generated by PyGameStudio (Web build).

     The page runs the game entirely inside the browser: Pyodide starts Python,
     the game archive is unpacked into its file system and web_boot.py starts
     the game loop. Nothing is uploaded anywhere, and there is nothing to
     click: the game starts by itself once it is ready (the thin bar under the
     canvas shows the loading progress).

     Serve this folder over HTTP (python -m http.server is enough): opening the
     file directly (file://) blocks the download of the archive.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PYGS_TITLE__</title>
__PYGS_FAVICON_LINK__
__PYGS_TOY_SDK_SCRIPT__
<style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #17181c; color: #e6e6ea;
                 font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
    #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .3px; }
    /* While the runtime loads the page shows title + splash + progress bar;
       once the game runs only the canvas is left on screen. The canvas is
       hidden with visibility (not display) and taken out of the flow, so it
       keeps a real element box the whole time - SDL reads that box to map
       mouse and touch positions, and a 0x0 one would divide by zero. */
    canvas#canvas { position: absolute; visibility: hidden;
                    background: #000; max-width: none; height: auto;
                    border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
                    outline: none; }
    body.running canvas#canvas { position: static; visibility: visible;
                                 border-radius: 0; box-shadow: none; }
    /* Once the game runs nothing else is on the page, so it may use the whole
       window - that is what makes "stretch to screen" actually stretch. */
    body.running #app { padding: 0; }
    #splash { max-width: min(70vw, 400px); max-height: 40vh; border-radius: 8px; }
    body.running #splash, body.running h1#title, body.running #loader { display: none; }
    #loader { display: flex; flex-direction: column; align-items: center; gap: 8px;
              width: min(320px, 80vw); }
    #loader-track { width: 100%; height: 4px; border-radius: 2px; background: #2a2c33; overflow: hidden; }
    #loader-bar { width: 4%; height: 100%; border-radius: 2px; background: #4f8cff;
                  transition: width .25s ease; }
    #loader-text { font-size: 12.5px; color: #a9adb8; text-align: center; }
    #error { display: none; max-width: 760px; font-size: 12.5px; line-height: 1.5; color: #ff8080;
             white-space: pre-wrap; word-break: break-word; text-align: left; }
</style>
</head>
<body>
<div id="app">
    <h1 id="title">__PYGS_TITLE__</h1>
    __PYGS_SPLASH_TAG__
    <canvas id="canvas" width="__PYGS_CANVAS_WIDTH__" height="__PYGS_CANVAS_HEIGHT__" tabindex="0"></canvas>
    <div id="loader">
        <div id="loader-track"><div id="loader-bar"></div></div>
        <div id="loader-text">0%</div>
    </div>
    <pre id="error"></pre>
</div>

<script>
// -- Page stages --------------------------------------------------------
// Two stages, driven from here so the page is right even when the Pyodide
// module cannot load (offline, blocked CDN):
//
//   loading  title + splash + progress bar, vertical, centred. No canvas yet.
//   running  the canvas only - everything else is removed from the layout.
//
// The canvas is scaled through CSS width/height and never with object-fit:
// the element box has to match the picture pixel for pixel, because SDL maps
// mouse and touch positions with getBoundingClientRect(). Its drawing buffer
// (the width/height attributes) never changes, so a window resize is free.
(function () {
    const CANVAS_WIDTH = __PYGS_CANVAS_WIDTH__;
    const CANVAS_HEIGHT = __PYGS_CANVAS_HEIGHT__;
    const CANVAS_FIT = "__PYGS_WEB_FIT__";
    const appElement = document.getElementById("app");
    const canvasElement = document.getElementById("canvas");

    function isShown(element) {
        if (!element) {
            return false;
        }
        const styles = getComputedStyle(element);
        return styles.display !== "none" && styles.visibility !== "hidden";
    }

    function applyCanvasFit() {
        if (!isShown(canvasElement)) {
            return;                     // still loading: nothing to fit yet
        }
        const styles = getComputedStyle(appElement);
        const gap = parseFloat(styles.rowGap) || 0;
        const paddingX = (parseFloat(styles.paddingLeft) || 0)
            + (parseFloat(styles.paddingRight) || 0);
        const paddingY = (parseFloat(styles.paddingTop) || 0)
            + (parseFloat(styles.paddingBottom) || 0);
        // Whatever the canvas shares the column with (nothing, once running),
        // plus one gap between every pair of visible items.
        let usedHeight = 0;
        let visibleCount = 0;
        for (const child of appElement.children) {
            if (child === canvasElement || !isShown(child)) {
                continue;
            }
            usedHeight += child.offsetHeight;
            visibleCount += 1;
        }
        visibleCount += 1;              // the canvas itself
        const availableWidth = Math.max(64, appElement.clientWidth - paddingX);
        const availableHeight = Math.max(64, window.innerHeight - paddingY
            - usedHeight - gap * (visibleCount - 1));
        let width = CANVAS_WIDTH;
        let height = CANVAS_HEIGHT;
        if (CANVAS_FIT === "show_all") {
            const scale = Math.min(availableWidth / CANVAS_WIDTH,
                                   availableHeight / CANVAS_HEIGHT);
            width = Math.round(CANVAS_WIDTH * scale);
            height = Math.round(CANVAS_HEIGHT * scale);
        } else if (CANVAS_FIT === "exact_fit") {
            width = Math.round(availableWidth);
            height = Math.round(availableHeight);
        } else if (CANVAS_FIT === "integer") {
            const scale = Math.max(1, Math.floor(Math.min(availableWidth / CANVAS_WIDTH,
                                                         availableHeight / CANVAS_HEIGHT)));
            width = CANVAS_WIDTH * scale;
            height = CANVAS_HEIGHT * scale;
        }
        canvasElement.style.width = width + "px";
        canvasElement.style.height = height + "px";
    }

    window.applyCanvasFit = applyCanvasFit;
    // The boot calls this right before the game loop starts: drop the title,
    // the splash and the bar, show the canvas, and size it to the whole page.
    window.showGameCanvas = function () {
        document.body.classList.add("running");
        applyCanvasFit();
    };
    window.addEventListener("resize", applyCanvasFit);
})();
</script>

<script type="module">
import { loadPyodide } from "__PYGS_PYODIDE_URL____PYGS_PYODIDE_ENTRY__";

// The Pyodide distribution to run (a folder URL with the Pyodide loader).
// The bundled runtime uses a relative path, so it resolves against this
// page's own folder; an absolute URL (CDN) passes through unchanged.
const PYODIDE_URL = new URL("__PYGS_PYODIDE_URL__", window.location.href).href;

const loaderElement = document.getElementById("loader");
const loaderBar = document.getElementById("loader-bar");
const loaderText = document.getElementById("loader-text");
const errorElement = document.getElementById("error");

// The bar and its caption both show the same progress (no wording).
const setProgress = (percent) => {
    loaderBar.style.width = percent + "%";
    loaderText.textContent = percent + "%";
};

const showError = (error) => {
    console.error(error);
    loaderElement.style.display = "none";
    errorElement.style.display = "block";
    errorElement.textContent = String((error && error.message) ? error.message : error);
};

// Browsers only start audio after a user gesture, so resume the WebAudio
// context of SDL on the first click/tap/key: the game's sound works from then
// on (the game itself is already running).
const resumeAudio = () => {
    try {
        const module = pyodide && pyodide._module;
        const context = module && (module.SDL2 ? module.SDL2.audioContext : null);
        if (context && context.resume) {
            context.resume();
        }
    } catch (error) {
        // No audio context yet: the next gesture tries again.
    }
};
document.addEventListener("pointerdown", resumeAudio);
document.addEventListener("keydown", resumeAudio);

// The bundle entry point: runs web_boot.py (the project root is /game) and
// awaits its async game loop.
const bootSource = `import sys
sys.path.insert(0, "/game")
with open("/game/web_boot.py", "r", encoding="utf-8") as boot_file:
    boot_source = boot_file.read()
namespace = {"__name__": "web_boot", "__file__": "/game/web_boot.py"}
exec(compile(boot_source, "/game/web_boot.py", "exec"), namespace)
await namespace["main"]()
`;

let pyodide = null;

try {
    setProgress(5);
    pyodide = await loadPyodide({ indexURL: PYODIDE_URL });

    // SDL-based packages (pygame) need this opt-in flag and a canvas to draw on.
    pyodide._api._skip_unwind_fatal_error = true;
    setProgress(30);

    await pyodide.loadPackage("pygame-ce");
    setProgress(55);

    const response = await fetch("__PYGS_GAME_ARCHIVE__");
    if (!response.ok) {
        throw new Error("__PYGS_GAME_ARCHIVE__ could not be loaded. Open this page over HTTP "
            + "(for example: python -m http.server), not from the file system. / "
            + "请通过 HTTP 访问本页面（例如 python -m http.server），不要直接打开文件。");
    }
    const archive = await response.arrayBuffer();
    setProgress(80);

    pyodide.unpackArchive(archive, "zip", { extractDir: "/game" });
    pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
    setProgress(95);

    // The boot drives the rest: it reports progress while it prepares the
    // game (physics install, project load) through these hooks and hides the
    // loading bar only when the game loop is about to start. No Start
    // button, no extra click.
    globalThis.__pygsProgress = setProgress;
    globalThis.__pygsGameStarted = () => {
        // The page switches from "loading" to "running": title, splash and bar
        // go away, the canvas appears and takes the whole window.
        if (window.showGameCanvas) {
            window.showGameCanvas();
        }
    };
    await pyodide.runPythonAsync(bootSource);
} catch (error) {
    showError(error);
}
</script>
</body>
</html>
